[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eeprog"
version = "1.0.0"
description = "A CLI programmer for the 28C64 EEPROM over serial"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Tobias Eriksson" },
]
dependencies = [
    "pyserial",
    "tqdm",
]

[project.scripts]
eeprog = "eeprog.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eeprog"]

